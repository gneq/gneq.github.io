name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HTML Index 자동 생성 (co, col, eb)
        run: node .github/scripts/generate-index.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (GitHub Pages 전용)
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
