name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HTML Index 자동 생성 (co, col, eb)
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const rootDir = process.cwd();
          const tabs = [
            { key: "co", label: "co", href: "../co/" },
            { key: "col", label: "col", href: "../col/" },
            { key: "eb", label: "eb", href: "../eb/" }
          ];

          const formatter = new Intl.DateTimeFormat("ko-KR", {
            timeZone: "Asia/Seoul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          });

          function getKstParts(date) {
            const parts = formatter.formatToParts(date);
            const dateObj = {};
            for (const p of parts) {
              dateObj[p.type] = p.value;
            }
            return dateObj;
          }

          function formatKst(date) {
            const d = getKstParts(date);
            return `${d.year}-${d.month}-${d.day} ${d.hour}:${d.minute}`;
          }

          function formatKstDateOnly(date) {
            const d = getKstParts(date);
            return `${d.year}-${d.month}-${d.day}`;
          }

          const todayKstStr = formatKstDateOnly(new Date());

          function getGitOrStatMtime(repoRelPath, fullPath) {
            try {
              const gitPath = repoRelPath.replace(/\\/g, "/");
              const gitTimeStr = execSync(`git log -1 --format=%ct -- "${gitPath}"`, {
                encoding: "utf-8"
              }).trim();
              if (gitTimeStr) {
                return new Date(parseInt(gitTimeStr, 10) * 1000);
              }
            } catch (e) {}
            return fs.statSync(fullPath).mtime;
          }

          function decodeHtmlEntities(str) {
            return String(str)
              .replace(/&amp;/g, "&")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&#x27;/g, "'")
              .replace(/&#(\d+);/g, (_, code) => String.fromCharCode(parseInt(code, 10)));
          }

          function normalizeKeywords(raw) {
            return String(raw || "")
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean)
              .filter((item, idx, arr) => arr.indexOf(item) === idx)
              .join(", ");
          }

          function getHtmlMetaInfo(fullPath) {
            let pageTitle = "";
            let keywords = "";
            try {
              const content = fs.readFileSync(fullPath, "utf-8");
              const titleMatch = content.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
              if (titleMatch && titleMatch[1]) {
                const cleaned = decodeHtmlEntities(titleMatch[1]).replace(/\s+/g, " ").trim();
                if (cleaned) pageTitle = cleaned;
              }

              const metaRegex = /<meta\b[^>]*>/gi;
              let m;
              while ((m = metaRegex.exec(content)) !== null) {
                const tag = m[0];
                const nameMatch = tag.match(/\bname\s*=\s*["']([^"']*)["']/i);
                if (nameMatch && nameMatch[1].toLowerCase() === "keywords") {
                  const contentMatch = tag.match(/\bcontent\s*=\s*["']([^"']*)["']/i);
                  if (contentMatch && contentMatch[1]) {
                    keywords = normalizeKeywords(decodeHtmlEntities(contentMatch[1]));
                  }
                  break;
                }
              }
            } catch (e) {}
            return { pageTitle, keywords };
          }

          function escapeAttr(str) {
            return String(str)
              .replace(/&/g, "&amp;")
              .replace(/"/g, "&quot;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }

          function renderTagsHtml(keywords) {
            const normalized = normalizeKeywords(keywords);
            if (!normalized) return "";
            const pills = normalized
              .split(",")
              .map((k) => `<span class="tag-pill">#${escapeAttr(k.trim())}</span>`)
              .join("");
            return `<span class="tag-list">${pills}</span>`;
          }

          function renderNav(activeKey) {
            const items = tabs
              .map((t) => {
                const activeClass = t.key === activeKey ? ' class="active"' : "";
                return `<a href="${t.href}"${activeClass}>${t.label}</a>`;
              })
              .join("\n");
            return `<header class="tabs-wrap">
              <nav class="tabs" aria-label="디렉토리 전환">
                <div class="tab-links">\n${items}\n</div>
                <button type="button" class="token-btn" onclick="manageToken()">토큰 설정</button>
              </nav>
            </header>`;
          }

          function renderFileRow({
            href,
            fileName,
            pageTitle,
            keywords = "",
            repoPath,
            timeStr,
            openInNewTab,
            allowTitleEdit = false,
            allowTagEdit = true
          }) {
            const targetAttr = openInNewTab ? ' target="_blank" rel="noopener"' : "";
            const baseName = fileName.replace(/\.html$/i, "");
            const showSubtitle = pageTitle && pageTitle !== baseName && pageTitle !== fileName;
            const subtitleHtml = showSubtitle
              ? `<span class="page-title">${escapeAttr(pageTitle)}</span>`
              : "";
            const tagsHtml = allowTagEdit ? renderTagsHtml(keywords) : "";
            const titleBtnHtml = allowTitleEdit
              ? `<button type="button" class="rename-file-btn" data-path="${escapeAttr(repoPath)}" data-title="${escapeAttr(pageTitle || "")}" onclick="editPageTitle(this)" title="페이지 제목 변경">제목</button>`
              : "";
            const tagBtnHtml = allowTagEdit
              ? `<button type="button" class="rename-file-btn" data-path="${escapeAttr(repoPath)}" data-tags="${escapeAttr(keywords || "")}" onclick="editPageTags(this)" title="메타 키워드 태그 설정">태그</button>`
              : "";
            return `<li>
              <div class="file-main">
                <div class="file-link-row">
                  <a href="${escapeAttr(href)}"${targetAttr}>${escapeAttr(baseName)}</a>
                  ${subtitleHtml}
                </div>
                ${tagsHtml}
              </div>
              <span class="meta">
                <span class="date">${timeStr}</span>
                ${titleBtnHtml}
                ${tagBtnHtml}
                <button type="button" class="rename-file-btn" data-path="${escapeAttr(repoPath)}" data-file="${escapeAttr(fileName)}" onclick="renameHtmlFile(this)" title="파일명 변경">변경</button>
                <button type="button" class="del-btn" data-path="${escapeAttr(repoPath)}" onclick="deleteHtmlFile(this)" title="GitHub에서 삭제">삭제</button>
              </span>
            </li>`;
          }

          const popupMarkup = [
            '<div id="ui-popup-backdrop" class="ui-popup-backdrop" hidden>',
            '  <div class="ui-popup-box">',
            '    <div id="ui-popup-title" class="ui-popup-title">알림</div>',
            '    <div id="ui-popup-message" class="ui-popup-message"></div>',
            '    <div id="ui-popup-input-row" class="ui-popup-input-row" hidden>',
            '      <input id="ui-popup-input" type="text" class="ui-popup-input" autocomplete="off" />',
            '    </div>',
            '    <div class="ui-popup-actions">',
            '      <button type="button" id="ui-popup-cancel" class="ui-btn ui-btn-secondary">취소</button>',
            '      <button type="button" id="ui-popup-ok" class="ui-btn ui-btn-primary">확인</button>',
            '    </div>',
            '  </div>',
            '</div>'
          ].join("\n");

          const clientScript = [
            "<script>",
            'const TOKEN_KEY = "gh_pages_delete_token";',
            "function openPopup({ mode = \"alert\", title = \"알림\", message = \"\", defaultValue = \"\", placeholder = \"\", okText = \"확인\", cancelText = \"취소\" }) {",
            "  return new Promise((resolve) => {",
            "    const backdrop = document.getElementById(\"ui-popup-backdrop\");",
            "    const titleEl = document.getElementById(\"ui-popup-title\");",
            "    const msgEl = document.getElementById(\"ui-popup-message\");",
            "    const inputRow = document.getElementById(\"ui-popup-input-row\");",
            "    const inputEl = document.getElementById(\"ui-popup-input\");",
            "    const okBtn = document.getElementById(\"ui-popup-ok\");",
            "    const cancelBtn = document.getElementById(\"ui-popup-cancel\");",
            "    titleEl.textContent = title;",
            "    msgEl.textContent = message;",
            "    okBtn.textContent = okText;",
            "    cancelBtn.textContent = cancelText;",
            "    const showInput = mode === \"prompt\";",
            "    const showCancel = mode === \"confirm\" || mode === \"prompt\";",
            "    inputRow.hidden = !showInput;",
            "    cancelBtn.hidden = !showCancel;",
            "    if (showInput) {",
            "      inputEl.value = defaultValue ?? \"\";",
            "      inputEl.placeholder = placeholder;",
            "    }",
            "    backdrop.hidden = false;",
            "    let settled = false;",
            "    function cleanup(result) {",
            "      if (settled) return;",
            "      settled = true;",
            "      backdrop.hidden = true;",
            "      okBtn.removeEventListener(\"click\", onOk);",
            "      cancelBtn.removeEventListener(\"click\", onCancel);",
            "      backdrop.removeEventListener(\"click\", onBackdrop);",
            "      document.removeEventListener(\"keydown\", onKeyDown);",
            "      resolve(result);",
            "    }",
            "    function onOk() {",
            "      if (mode === \"prompt\") cleanup(inputEl.value);",
            "      else cleanup(true);",
            "    }",
            "    function onCancel() {",
            "      if (mode === \"prompt\") cleanup(null);",
            "      else cleanup(false);",
            "    }",
            "    function onBackdrop(e) {",
            "      if (e.target === backdrop) onCancel();",
            "    }",
            "    function onKeyDown(e) {",
            "      if (e.key === \"Escape\") {",
            "        e.preventDefault();",
            "        onCancel();",
            "      } else if (e.key === \"Enter\" && document.activeElement !== cancelBtn) {",
            "        e.preventDefault();",
            "        onOk();",
            "      }",
            "    }",
            "    okBtn.addEventListener(\"click\", onOk);",
            "    cancelBtn.addEventListener(\"click\", onCancel);",
            "    backdrop.addEventListener(\"click\", onBackdrop);",
            "    document.addEventListener(\"keydown\", onKeyDown);",
            "    setTimeout(() => {",
            "      if (showInput) { inputEl.focus(); inputEl.select(); }",
            "      else okBtn.focus();",
            "    }, 10);",
            "  });",
            "}",
            "function uiAlert(message, title = \"알림\") {",
            "  return openPopup({ mode: \"alert\", title, message, okText: \"확인\" });",
            "}",
            "function uiConfirm(message, title = \"확인\") {",
            "  return openPopup({ mode: \"confirm\", title, message, okText: \"확인\", cancelText: \"취소\" });",
            "}",
            "function uiPrompt(message, defaultValue = \"\", title = \"입력\", placeholder = \"\") {",
            "  return openPopup({ mode: \"prompt\", title, message, defaultValue, placeholder, okText: \"확인\", cancelText: \"취소\" });",
            "}",
            "function normalizeKeywordsClient(raw) {",
            "  return String(raw || \"\")",
            "    .split(\",\")",
            "    .map((s) => s.trim())",
            "    .filter(Boolean)",
            "    .filter((item, idx, arr) => arr.indexOf(item) === idx)",
            "    .join(\", \");",
            "}",
            "function updateRowTagsDom(li, keywordsStr) {",
            "  if (!li) return;",
            "  const mainEl = li.querySelector(\".file-main\");",
            "  if (!mainEl) return;",
            "  let tagListEl = mainEl.querySelector(\".tag-list\");",
            "  const normalized = normalizeKeywordsClient(keywordsStr);",
            "  if (!normalized) {",
            "    if (tagListEl) tagListEl.remove();",
            "    return;",
            "  }",
            "  if (!tagListEl) {",
            "    tagListEl = document.createElement(\"span\");",
            "    tagListEl.className = \"tag-list\";",
            "    mainEl.appendChild(tagListEl);",
            "  }",
            "  tagListEl.innerHTML = normalized",
            "    .split(\",\")",
            "    .map((k) => `<span class=\"tag-pill\">#${escapeHtmlClient(k.trim())}</span>`)",
            "    .join(\"\");",
            "}",
            "function escapeHtmlClient(str) {",
            "  return String(str || \"\")",
            "    .replace(/&/g, \"&amp;\")",
            "    .replace(/</g, \"&lt;\")",
            "    .replace(/>/g, \"&gt;\")",
            "    .replace(/\"/g, \"&quot;\");",
            "}",
            "function getRepoInfo() {",
            "  const hostParts = window.location.hostname.split(\".\");",
            "  const owner = hostParts[0] || \"\";",
            "  const pathParts = window.location.pathname.split(\"/\").filter(Boolean);",
            "  let repo = `${owner}.github.io`;",
            "  if (!window.location.hostname.endsWith(\".github.io\") && pathParts.length > 0) {",
            "    repo = pathParts[0];",
            "  }",
            "  return { owner, repo };",
            "}",
            "function encodeRepoPath(filePath) {",
            "  return filePath.split(\"/\").map(encodeURIComponent).join(\"/\");",
            "}",
            "function getHeaders(token, withJson = false) {",
            "  const h = {",
            "    \"Authorization\": `Bearer ${token}`,",
            "    \"Accept\": \"application/vnd.github+json\",",
            "    \"X-GitHub-Api-Version\": \"2022-11-28\"",
            "  };",
            "  if (withJson) h[\"Content-Type\"] = \"application/json\";",
            "  return h;",
            "}",
            "function encodeUtf8Base64(str) {",
            "  const bytes = new TextEncoder().encode(str);",
            "  let bin = \"\";",
            "  for (let i = 0; i < bytes.length; i++) {",
            "    bin += String.fromCharCode(bytes[i]);",
            "  }",
            "  return btoa(bin);",
            "}",
            "function decodeUtf8Base64(b64) {",
            "  const clean = (b64 || \"\").replace(/\\n/g, \"\");",
            "  const bin = atob(clean);",
            "  const bytes = new Uint8Array(bin.length);",
            "  for (let i = 0; i < bin.length; i++) {",
            "    bytes[i] = bin.charCodeAt(i);",
            "  }",
            "  return new TextDecoder(\"utf-8\").decode(bytes);",
            "}",
            "async function manageToken() {",
            "  const current = localStorage.getItem(TOKEN_KEY) || \"\";",
            "  const next = await uiPrompt(",
            "    \"GitHub Fine-grained PAT를 입력하세요 (빈 값 입력 시 삭제):\",",
            "    current,",
            "    \"토큰 설정\",",
            "    \"github_pat_...\"",
            "  );",
            "  if (next === null) return;",
            "  const trimmed = next.trim();",
            "  if (!trimmed) {",
            "    localStorage.removeItem(TOKEN_KEY);",
            "    await uiAlert(\"저장된 토큰을 삭제했습니다.\");",
            "  } else {",
            "    localStorage.setItem(TOKEN_KEY, trimmed);",
            "    await uiAlert(\"토큰이 브라우저 localStorage에 저장되었습니다.\");",
            "  }",
            "}",
            "async function ensureToken() {",
            "  let token = localStorage.getItem(TOKEN_KEY);",
            "  if (!token) {",
            "    const input = await uiPrompt(",
            "      \"파일/디렉토리 변경을 위해 GitHub PAT(Contents: Read and write 권한)를 입력하세요:\",",
            "      \"\",",
            "      \"GitHub 토큰 입력\",",
            "      \"github_pat_...\"",
            "    );",
            "    if (!input || !input.trim()) return null;",
            "    token = input.trim();",
            "    localStorage.setItem(TOKEN_KEY, token);",
            "  }",
            "  return token;",
            "}",
            "async function editPageTitle(btn) {",
            "  const filePath = btn.getAttribute(\"data-path\");",
            "  const currentTitle = btn.getAttribute(\"data-title\") || \"\";",
            "  if (!filePath) return;",
            "  const input = await uiPrompt(`'${filePath}'의 새 페이지 제목(<title>)을 입력하세요:`, currentTitle, \"페이지 제목 변경\");",
            "  if (input === null) return;",
            "  const nextTitle = input.trim();",
            "  if (!nextTitle || nextTitle === currentTitle) return;",
            "  const token = await ensureToken();",
            "  if (!token) return;",
            "  const { owner, repo } = getRepoInfo();",
            "  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(filePath)}?ref=main`;",
            "  btn.disabled = true;",
            "  const origText = btn.textContent;",
            "  btn.textContent = \"수정중...\";",
            "  try {",
            "    const res = await fetch(apiUrl, { headers: getHeaders(token) });",
            "    if (!res.ok) {",
            "      const errData = await res.json().catch(() => ({}));",
            "      throw new Error(errData.message || `파일 조회 실패 (${res.status})`);",
            "    }",
            "    const data = await res.json();",
            "    let html = decodeUtf8Base64(data.content);",
            "    const escapedTitle = nextTitle.replace(/&/g, \"&amp;\").replace(/</g, \"&lt;\").replace(/>/g, \"&gt;\");",
            "    if (/<title[^>]*>[\\s\\S]*?<\\/title>/i.test(html)) {",
            "      html = html.replace(/<title[^>]*>[\\s\\S]*?<\\/title>/i, `<title>${escapedTitle}</title>`);",
            "    } else if (/<head[^>]*>/i.test(html)) {",
            "      html = html.replace(/<head([^>]*)>/i, `<head$1>\\n  <title>${escapedTitle}</title>`);",
            "    } else {",
            "      html = `<title>${escapedTitle}</title>\\n` + html;",
            "    }",
            "    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(filePath)}`, {",
            "      method: \"PUT\",",
            "      headers: getHeaders(token, true),",
            "      body: JSON.stringify({",
            "        message: `chore: update page title in ${filePath}`,",
            "        content: encodeUtf8Base64(html),",
            "        sha: data.sha,",
            "        branch: \"main\"",
            "      })",
            "    });",
            "    if (!putRes.ok) {",
            "      const errData = await putRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `제목 저장 실패 (${putRes.status})`);",
            "    }",
            "    btn.setAttribute(\"data-title\", nextTitle);",
            "    const li = btn.closest(\"li\");",
            "    if (li) {",
            "      let sub = li.querySelector(\".page-title\");",
            "      if (!sub) {",
            "        sub = document.createElement(\"span\");",
            "        sub.className = \"page-title\";",
            "        const linkRow = li.querySelector(\".file-link-row\") || li.querySelector(\".file-main\");",
            "        if (linkRow) linkRow.appendChild(sub);",
            "      }",
            "      sub.textContent = nextTitle;",
            "    }",
            "    await uiAlert(`'${filePath}'의 제목이 '${nextTitle}'(으)로 변경되었습니다. Pages 재배포까지 잠시 기다려 주세요.`);",
            "  } catch (err) {",
            "    await uiAlert(`제목 변경 중 오류가 발생했습니다:\\n${err.message}`, \"오류\");",
            "  } finally {",
            "    btn.disabled = false;",
            "    btn.textContent = origText;",
            "  }",
            "}",
            "async function editPageTags(btn) {",
            "  const filePath = btn.getAttribute(\"data-path\");",
            "  const currentTags = btn.getAttribute(\"data-tags\") || \"\";",
            "  if (!filePath) return;",
            "  const input = await uiPrompt(",
            "    `'${filePath}'의 메타 키워드 태그를 입력하세요 (쉼표 , 로 구분, 비우면 제거):`,",
            "    currentTags,",
            "    \"메타 키워드 태그 설정\",",
            "    \"예: 기획, 디자인, 메모\"",
            "  );",
            "  if (input === null) return;",
            "  const nextTags = normalizeKeywordsClient(input);",
            "  if (nextTags === normalizeKeywordsClient(currentTags)) return;",
            "  const token = await ensureToken();",
            "  if (!token) return;",
            "  const { owner, repo } = getRepoInfo();",
            "  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(filePath)}?ref=main`;",
            "  btn.disabled = true;",
            "  const origText = btn.textContent;",
            "  btn.textContent = \"저장중...\";",
            "  try {",
            "    const res = await fetch(apiUrl, { headers: getHeaders(token) });",
            "    if (!res.ok) {",
            "      const errData = await res.json().catch(() => ({}));",
            "      throw new Error(errData.message || `파일 조회 실패 (${res.status})`);",
            "    }",
            "    const data = await res.json();",
            "    let html = decodeUtf8Base64(data.content);",
            "    const escapedKeywords = escapeHtmlClient(nextTags);",
            "    const metaKeywordsRegex = /<meta\\b[^>]*\\bname\\s*=\\s*[\"']keywords[\"'][^>]*>/i;",
            "    if (nextTags) {",
            "      const newMetaTag = `<meta name=\"keywords\" content=\"${escapedKeywords}\" />`;",
            "      if (metaKeywordsRegex.test(html)) {",
            "        html = html.replace(metaKeywordsRegex, newMetaTag);",
            "      } else if (/<head[^>]*>/i.test(html)) {",
            "        html = html.replace(/<head([^>]*)>/i, `<head$1>\\n  ${newMetaTag}`);",
            "      } else {",
            "        html = `${newMetaTag}\\n` + html;",
            "      }",
            "    } else {",
            "      html = html.replace(/\\s*<meta\\b[^>]*\\bname\\s*=\\s*[\"']keywords[\"'][^>]*>\\s*/gi, \"\\n\");",
            "    }",
            "    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(filePath)}`, {",
            "      method: \"PUT\",",
            "      headers: getHeaders(token, true),",
            "      body: JSON.stringify({",
            "        message: `chore: update meta keywords in ${filePath}`,",
            "        content: encodeUtf8Base64(html),",
            "        sha: data.sha,",
            "        branch: \"main\"",
            "      })",
            "    });",
            "    if (!putRes.ok) {",
            "      const errData = await putRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `태그 저장 실패 (${putRes.status})`);",
            "    }",
            "    btn.setAttribute(\"data-tags\", nextTags);",
            "    updateRowTagsDom(btn.closest(\"li\"), nextTags);",
            "    await uiAlert(",
            "      nextTags",
            "        ? `'${filePath}'의 메타 태그가 '${nextTags}'(으)로 저장되었습니다. Pages 재배포까지 잠시 기다려 주세요.`",
            "        : `'${filePath}'의 메타 태그가 제거되었습니다. Pages 재배포까지 잠시 기다려 주세요.'",
            "    );",
            "  } catch (err) {",
            "    await uiAlert(`태그 저장 중 오류가 발생했습니다:\\n${err.message}`, \"오류\");",
            "  } finally {",
            "    btn.disabled = false;",
            "    btn.textContent = origText;",
            "  }",
            "}",
            "async function renameHtmlFile(btn) {",
            "  const oldPath = btn.getAttribute(\"data-path\");",
            "  const oldFileName = btn.getAttribute(\"data-file\");",
            "  if (!oldPath || !oldFileName) return;",
            "  const currentBase = oldFileName.replace(/\\.html$/i, \"\");",
            "  const input = await uiPrompt(`'${currentBase}'의 새 파일명을 입력하세요 (.html 자동 추가):`, currentBase, \"파일명 변경\");",
            "  if (input === null) return;",
            "  let nextBase = input.trim();",
            "  if (!nextBase) return;",
            "  if (nextBase.toLowerCase().endsWith(\".html\")) {",
            "    nextBase = nextBase.slice(0, -5);",
            "  }",
            "  if (!nextBase || nextBase.includes(\"/\") || nextBase.includes(\"\\\\\")) {",
            "    await uiAlert(\"유효하지 않은 파일명입니다.\", \"입력 오류\");",
            "    return;",
            "  }",
            "  const nextFileName = `${nextBase}.html`;",
            "  if (nextFileName === oldFileName) return;",
            "  const parentDir = oldPath.includes(\"/\") ? oldPath.slice(0, oldPath.lastIndexOf(\"/\")) : \"\";",
            "  const newPath = parentDir ? `${parentDir}/${nextFileName}` : nextFileName;",
            "  const ok = await uiConfirm(`파일명을 변경할까요?\\n${oldPath} → ${newPath}`, \"파일명 변경 확인\");",
            "  if (!ok) return;",
            "  const token = await ensureToken();",
            "  if (!token) return;",
            "  const { owner, repo } = getRepoInfo();",
            "  btn.disabled = true;",
            "  const origText = btn.textContent;",
            "  btn.textContent = \"변경중...\";",
            "  try {",
            "    const metaRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(oldPath)}?ref=main`, {",
            "      headers: getHeaders(token)",
            "    });",
            "    if (!metaRes.ok) {",
            "      const errData = await metaRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `파일 조회 실패 (${metaRes.status})`);",
            "    }",
            "    const meta = await metaRes.json();",
            "    const base64Content = (meta.content || \"\").replace(/\\n/g, \"\");",
            "    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(newPath)}`, {",
            "      method: \"PUT\",",
            "      headers: getHeaders(token, true),",
            "      body: JSON.stringify({",
            "        message: `chore: rename ${oldPath} to ${newPath}`,",
            "        content: base64Content,",
            "        branch: \"main\"",
            "      })",
            "    });",
            "    if (!putRes.ok) {",
            "      const errData = await putRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `새 파일 생성 실패 (${putRes.status})`);",
            "    }",
            "    const delRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(oldPath)}`, {",
            "      method: \"DELETE\",",
            "      headers: getHeaders(token, true),",
            "      body: JSON.stringify({",
            "        message: `chore: remove old ${oldPath}`,",
            "        sha: meta.sha,",
            "        branch: \"main\"",
            "      })",
            "    });",
            "    if (!delRes.ok) {",
            "      const errData = await delRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `기존 파일 삭제 실패 (${delRes.status})`);",
            "    }",
            "    await uiAlert(`'${oldPath}' → '${newPath}' 변경이 완료되었습니다. Pages 재배포까지 잠시 기다려 주세요.`);",
            "  } catch (err) {",
            "    await uiAlert(`파일명 변경 중 오류가 발생했습니다:\\n${err.message}`, \"오류\");",
            "    btn.disabled = false;",
            "    btn.textContent = origText;",
            "  }",
            "}",
            "async function deleteHtmlFile(btn) {",
            "  const filePath = btn.getAttribute(\"data-path\");",
            "  if (!filePath) return;",
            "  const ok = await uiConfirm(`정말로 GitHub에서 '${filePath}' 파일을 삭제할까요?\\n삭제 커밋이 main 브랜치에 반영됩니다.`, \"파일 삭제 확인\");",
            "  if (!ok) return;",
            "  const token = await ensureToken();",
            "  if (!token) return;",
            "  const { owner, repo } = getRepoInfo();",
            "  const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(filePath)}`;",
            "  btn.disabled = true;",
            "  const origText = btn.textContent;",
            "  btn.textContent = \"삭제중...\";",
            "  try {",
            "    const getRes = await fetch(apiBase, { headers: getHeaders(token) });",
            "    if (!getRes.ok) {",
            "      const errData = await getRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `파일 정보 조회 실패 (${getRes.status})`);",
            "    }",
            "    const fileInfo = await getRes.json();",
            "    const delRes = await fetch(apiBase, {",
            "      method: \"DELETE\",",
            "      headers: getHeaders(token, true),",
            "      body: JSON.stringify({",
            "        message: `chore: delete ${filePath}`,",
            "        sha: fileInfo.sha,",
            "        branch: \"main\"",
            "      })",
            "    });",
            "    if (!delRes.ok) {",
            "      const errData = await delRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `삭제 실패 (${delRes.status})`);",
            "    }",
            "    const li = btn.closest(\"li\");",
            "    if (li) li.remove();",
            "    await uiAlert(`'${filePath}' 삭제가 완료되었습니다. Pages 재배포까지 잠시 기다려 주세요.`);",
            "  } catch (err) {",
            "    await uiAlert(`삭제 중 오류가 발생했습니다:\\n${err.message}`, \"오류\");",
            "    btn.disabled = false;",
            "    btn.textContent = origText;",
            "  }",
            "}",
            "async function collectFilesRecursive(owner, repo, dirPath, token) {",
            "  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(dirPath)}?ref=main`;",
            "  const res = await fetch(apiUrl, { headers: getHeaders(token) });",
            "  if (!res.ok) {",
            "    const errData = await res.json().catch(() => ({}));",
            "    throw new Error(errData.message || `디렉토리 조회 실패 (${res.status})`);",
            "  }",
            "  const entries = await res.json();",
            "  const list = Array.isArray(entries) ? entries : [entries];",
            "  let files = [];",
            "  for (const item of list) {",
            "    if (item.type === \"file\") {",
            "      files.push({ path: item.path, sha: item.sha });",
            "    } else if (item.type === \"dir\") {",
            "      const nested = await collectFilesRecursive(owner, repo, item.path, token);",
            "      files = files.concat(nested);",
            "    }",
            "  }",
            "  return files;",
            "}",
            "async function deleteDirectory(event, btn) {",
            "  event.preventDefault();",
            "  event.stopPropagation();",
            "  const dirPath = btn.getAttribute(\"data-dir-path\");",
            "  const dirName = btn.getAttribute(\"data-dir-name\");",
            "  if (!dirPath) return;",
            "  const ok = await uiConfirm(`정말로 '${dirName || dirPath}' 디렉토리와 내부의 모든 파일을 GitHub에서 삭제할까요?\\n삭제 커밋이 main 브랜치에 반영됩니다.`, \"디렉토리 삭제 확인\");",
            "  if (!ok) return;",
            "  const token = await ensureToken();",
            "  if (!token) return;",
            "  const { owner, repo } = getRepoInfo();",
            "  btn.disabled = true;",
            "  const origText = btn.textContent;",
            "  btn.textContent = \"삭제중...\";",
            "  try {",
            "    const files = await collectFilesRecursive(owner, repo, dirPath, token);",
            "    for (const f of files) {",
            "      const delRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(f.path)}`, {",
            "        method: \"DELETE\",",
            "        headers: getHeaders(token, true),",
            "        body: JSON.stringify({",
            "          message: `chore: delete ${f.path}`,",
            "          sha: f.sha,",
            "          branch: \"main\"",
            "        })",
            "      });",
            "      if (!delRes.ok) {",
            "        const errData = await delRes.json().catch(() => ({}));",
            "        throw new Error(errData.message || `파일 삭제 실패 (${f.path})`);",
            "      }",
            "    }",
            "    const detailsEl = btn.closest(\"details\");",
            "    if (detailsEl) detailsEl.remove();",
            "    await uiAlert(`'${dirPath}' 디렉토리 삭제가 완료되었습니다. Pages 재배포까지 잠시 기다려 주세요.`);",
            "  } catch (err) {",
            "    await uiAlert(`디렉토리 삭제 중 오류가 발생했습니다:\\n${err.message}`, \"오류\");",
            "    btn.disabled = false;",
            "    btn.textContent = origText;",
            "  }",
            "}",
            "async function renameDirectory(event, btn) {",
            "  event.preventDefault();",
            "  event.stopPropagation();",
            "  const oldDirPath = btn.getAttribute(\"data-dir-path\");",
            "  const oldDirName = btn.getAttribute(\"data-dir-name\");",
            "  if (!oldDirPath || !oldDirName) return;",
            "  const input = await uiPrompt(`'${oldDirName}' 디렉토리의 새 이름을 입력하세요:`, oldDirName, \"디렉토리 이름 변경\");",
            "  if (input === null) return;",
            "  const nextName = input.trim();",
            "  if (!nextName || nextName === oldDirName) return;",
            "  if (nextName.includes(\"/\") || nextName.includes(\"\\\\\")) {",
            "    await uiAlert(\"디렉토리 이름에는 슬래시(/, \\\\)를 포함할 수 없습니다.\", \"입력 오류\");",
            "    return;",
            "  }",
            "  const parentPath = oldDirPath.includes(\"/\") ? oldDirPath.slice(0, oldDirPath.lastIndexOf(\"/\")) : \"\";",
            "  const newDirPath = parentPath ? `${parentPath}/${nextName}` : nextName;",
            "  const ok = await uiConfirm(`디렉토리 이름을 변경할까요?\\n${oldDirPath} → ${newDirPath}`, \"디렉토리 이름 변경 확인\");",
            "  if (!ok) return;",
            "  const token = await ensureToken();",
            "  if (!token) return;",
            "  const { owner, repo } = getRepoInfo();",
            "  btn.disabled = true;",
            "  const origText = btn.textContent;",
            "  btn.textContent = \"변경중...\";",
            "  try {",
            "    const files = await collectFilesRecursive(owner, repo, oldDirPath, token);",
            "    if (files.length === 0) {",
            "      throw new Error(\"이동할 파일이 없습니다.\");",
            "    }",
            "    for (const f of files) {",
            "      const metaRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(f.path)}?ref=main`, {",
            "        headers: getHeaders(token)",
            "      });",
            "      if (!metaRes.ok) {",
            "        const errData = await metaRes.json().catch(() => ({}));",
            "        throw new Error(errData.message || `파일 읽기 실패 (${f.path})`);",
            "      }",
            "      const meta = await metaRes.json();",
            "      const base64Content = (meta.content || \"\").replace(/\\n/g, \"\");",
            "      const targetFilePath = newDirPath + f.path.slice(oldDirPath.length);",
            "      const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(targetFilePath)}`, {",
            "        method: \"PUT\",",
            "        headers: getHeaders(token, true),",
            "        body: JSON.stringify({",
            "          message: `chore: move ${f.path} to ${targetFilePath}`,",
            "          content: base64Content,",
            "          branch: \"main\"",
            "        })",
            "      });",
            "      if (!putRes.ok) {",
            "        const errData = await putRes.json().catch(() => ({}));",
            "        throw new Error(errData.message || `새 경로 생성 실패 (${targetFilePath})`);",
            "      }",
            "      const delRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeRepoPath(f.path)}`, {",
            "        method: \"DELETE\",",
            "        headers: getHeaders(token, true),",
            "        body: JSON.stringify({",
            "          message: `chore: remove old ${f.path}`,",
            "          sha: meta.sha,",
            "          branch: \"main\"",
            "        })",
            "      });",
            "      if (!delRes.ok) {",
            "        const errData = await delRes.json().catch(() => ({}));",
            "        throw new Error(errData.message || `기존 파일 삭제 실패 (${f.path})`);",
            "      }",
            "    }",
            "    await uiAlert(`'${oldDirPath}' → '${newDirPath}' 이름 변경이 완료되었습니다. Pages 재배포까지 잠시 기다려 주세요.`);",
            "  } catch (err) {",
            "    await uiAlert(`이름 변경 중 오류가 발생했습니다:\\n${err.message}`, \"오류\");",
            "    btn.disabled = false;",
            "    btn.textContent = origText;",
            "  }",
            "}",
            "</script>"
          ].join("\n");

          function wrapPage({ title, heading, activeKey, bodyHtml }) {
            return `<!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>${escapeAttr(title)}</title>
            <style>
