name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main  # 메인 브랜치에 푸시될 때 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git 히스토리를 전체 다 가져오도록 설정

      - name: Index.html 자동 생성 및 한국 시간(KST) 정렬 스크립트 실행
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            const colDir = path.join(__dirname, "col");
            
            if (!fs.existsSync(colDir)) {
              console.log("col 디렉토리가 존재하지 않습니다.");
              process.exit(0);
            }

            const files = fs.readdirSync(colDir)
              .filter(file => file.endsWith(".html") && file !== "index.html")
              .map(file => {
                const filePath = `col/${file}`;
                let mtime;

                try {
                  const gitTimeStr = execSync(`git log -1 --format=%ct -- "${filePath}"`, { encoding: "utf-8" }).trim();
                  if (gitTimeStr) {
                    mtime = new Date(parseInt(gitTimeStr, 10) * 1000);
                  } else {
                    mtime = fs.statSync(path.join(colDir, file)).mtime;
                  }
                } catch (e) {
                  mtime = fs.statSync(path.join(colDir, file)).mtime;
                }

                return {
                  name: file,
                  title: file.replace(/\.html$/, ""),
                  mtime: mtime
                };
              });

            // 최신 커밋 순으로 정렬 (내림차순)
            files.sort((a, b) => b.mtime - a.mtime);

            // HTML 리스트 항목 생성 (한국 시간 KST 기준 포맷팅)
            const listItems = files.map(file => {
              const formatter = new Intl.DateTimeFormat("ko-KR", {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
              });

              // "2026. 06. 06. 23:45" 형태의 문자열을 보기 좋게 변환
              const parts = formatter.formatToParts(file.mtime);
              const dateObj = {};
              parts.forEach(p => { dateObj[p.type] = p.value; });
              
              const timeStr = `${dateObj.year}-${dateObj.month}-${dateObj.day} ${dateObj.hour}:${dateObj.minute}`;

              return `<li>
                <a href="${file.name}">${file.title}</a>
                <span class="date">[${timeStr}]</span>
              </li>`;
            }).join("\n");

            const htmlContent = `<!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <title>Col HTML 파일 목록</title>
                <style>
                    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
                    h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
                    ul { line-height: 1.8; list-style-type: none; padding: 0; }
                    li { margin-bottom: 8px; border-bottom: 1px dashed #f0f0f0; padding-bottom: 4px; }
                    a { text-decoration: none; color: #0066cc; font-weight: bold; }
                    a:hover { text-decoration: underline; }
                    .date { float: right; color: #888; font-size: 0.85em; }
                </style>
            </head>
            <body>
                <h1>📁 Col Directory HTML List</h1>
                <ul>
                    ${listItems}
                </ul>
            </body>
            </html>`;

            fs.writeFileSync(path.join(colDir, "index.html"), htmlContent);
            console.log("col/index.html이 한국 시간(KST) 기준으로 성공적으로 생성되었습니다.");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (GitHub Pages 전용)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
