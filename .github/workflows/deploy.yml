name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Col 디렉토리 Index.html 자동 생성 (최신 커밋 순 내림차순)
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            const colDir = path.join(__dirname, "col");

            if (!fs.existsSync(colDir)) {
              console.log("col 디렉토리가 존재하지 않습니다.");
            } else {
              const files = fs.readdirSync(colDir)
                .filter(file => file.endsWith(".html") && file !== "index.html")
                .map(file => {
                  const filePath = `col/${file}`;
                  let mtime;

                  try {
                    const gitTimeStr = execSync(`git log -1 --format=%ct -- "${filePath}"`, { encoding: "utf-8" }).trim();
                    mtime = gitTimeStr
                      ? new Date(parseInt(gitTimeStr, 10) * 1000)
                      : fs.statSync(path.join(colDir, file)).mtime;
                  } catch (e) {
                    mtime = fs.statSync(path.join(colDir, file)).mtime;
                  }

                  return {
                    name: file,
                    title: file.replace(/\.html$/, ""),
                    mtime
                  };
                });

              files.sort((a, b) => b.mtime - a.mtime);

              const formatter = new Intl.DateTimeFormat("ko-KR", {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
              });

              const listItems = files.map(file => {
                const parts = formatter.formatToParts(file.mtime);
                const dateObj = {};
                parts.forEach(p => { dateObj[p.type] = p.value; });
                const timeStr = `${dateObj.year}-${dateObj.month}-${dateObj.day} ${dateObj.hour}:${dateObj.minute}`;

                return `<li>
                  <a href="${file.name}">${file.title}</a>
                  <span class="date">[${timeStr}]</span>
                </li>`;
              }).join("\n");

              const htmlContent = `<!DOCTYPE html>
              <html lang="ko">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1" />
                  <title>Col HTML 파일 목록</title>
                  <style>
                      html {font-size: 20px}
                      body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
                      h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
                      ul { line-height: 1.8; list-style-type: none; padding: 0; text-align: justify; word-break: keep-all; }
                      li { margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 4px; }
                      a { text-decoration: none; color: #0066cc; }
                      a:hover { text-decoration: underline; }
                      .date { float: right; color: #888; font-size: 0.85em; }
                  </style>
              </head>
              <body>
                  <h1>📁 Col Directory HTML List</h1>
                  <ul>
                      ${listItems}
                  </ul>
              </body>
              </html>`;

              fs.writeFileSync(path.join(colDir, "index.html"), htmlContent);
              console.log("col/index.html 생성 완료");
            }
          '

      - name: Eb 및 Co 디렉토리 Index.html 자동 생성
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            const formatter = new Intl.DateTimeFormat("ko-KR", {
              timeZone: "Asia/Seoul",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false
            });

            function formatKst(date) {
              const parts = formatter.formatToParts(date);
              const dateObj = {};
              parts.forEach(p => { dateObj[p.type] = p.value; });
              return `${dateObj.year}-${dateObj.month}-${dateObj.day} ${dateObj.hour}:${dateObj.minute}`;
            }

            function buildTreeIndex(dirName, pageTitle, headingText) {
              const targetDir = path.join(__dirname, dirName);
              if (!fs.existsSync(targetDir)) {
                console.log(`${dirName} 디렉토리가 존재하지 않습니다.`);
                return;
              }

              function scanDirectory(dir, relativePath = "") {
                const entries = fs.readdirSync(dir, { withFileTypes: true });
                let latestTime = 0;
                const structure = { directories: {}, files: [], latestMtime: 0 };

                for (const entry of entries) {
                  const fullPath = path.join(dir, entry.name);
                  const relPath = path.join(relativePath, entry.name);

                  if (entry.isDirectory()) {
                    const subNode = scanDirectory(fullPath, relPath);
                    structure.directories[entry.name] = subNode;
                    if (subNode.latestMtime > latestTime) {
                      latestTime = subNode.latestMtime;
                    }
                  } else if (entry.isFile() && entry.name.endsWith(".html") && entry.name !== "index.html") {
                    let mtime;
                    try {
                      const gitPath = `${dirName}/${relPath}`.replace(/\\/g, "/");
                      const gitTimeStr = execSync(`git log -1 --format=%ct -- "${gitPath}"`, { encoding: "utf-8" }).trim();
                      mtime = gitTimeStr
                        ? new Date(parseInt(gitTimeStr, 10) * 1000)
                        : fs.statSync(fullPath).mtime;
                    } catch (e) {
                      mtime = fs.statSync(fullPath).mtime;
                    }

                    const fileTime = mtime.getTime();
                    if (fileTime > latestTime) {
                      latestTime = fileTime;
                    }

                    structure.files.push({
                      name: entry.name,
                      title: entry.name.replace(/\.html$/, ""),
                      path: relPath.replace(/\\/g, "/"),
                      mtime,
                      timeStr: formatKst(mtime)
                    });
                  }
                }

                structure.files.sort((a, b) => a.name.localeCompare(b.name, "ko", { numeric: true }));
                structure.latestMtime = latestTime;
                return structure;
              }

              function renderTree(node) {
                let html = "";

                if (node.files && node.files.length > 0) {
                  html += "<ul>";
                  for (const file of node.files) {
                    html += `<li>
                      <a href="${file.path}" target="_blank">${file.title}</a>
                      <span class="date">[${file.timeStr}]</span>
                    </li>`;
                  }
                  html += "</ul>";
                }

                const sortedDirs = Object.entries(node.directories).sort((a, b) => {
                  if (b[1].latestMtime !== a[1].latestMtime) {
                    return b[1].latestMtime - a[1].latestMtime;
                  }
                  return a[0].localeCompare(b[0], "ko", { numeric: true });
                });

                for (const [subDirName, subNode] of sortedDirs) {
                  const hasContent = subNode.files.length > 0 || Object.keys(subNode.directories).length > 0;
                  if (hasContent) {
                    html += `<details>
                      <summary>📁 <strong>${subDirName}</strong></summary>
                      <div class="sub-folder">
                        ${renderTree(subNode)}
                      </div>
                    </details>`;
                  }
                }

                return html;
              }

              const treeData = scanDirectory(targetDir);
              const treeHtml = renderTree(treeData);

              const htmlContent = `<!DOCTYPE html>
              <html lang="ko">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1" />
                  <title>${pageTitle}</title>
                  <style>
                      html { font-size: 18px; }
                      body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; color: #333; }
                      h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.5rem; }
                      ul { line-height: 1.8; list-style-type: none; padding-left: 15px; margin: 5px 0; }
                      li { margin-bottom: 6px; border-bottom: 1px dashed #f0f0f0; padding-bottom: 4px; }
                      a { text-decoration: none; color: #0066cc; }
                      a:hover { text-decoration: underline; }
                      .date { float: right; color: #888; font-size: 0.8em; }
                      details { margin: 10px 0; border: 1px solid #e1e4e8; border-radius: 6px; padding: 8px 12px; background: #fafbfc; }
                      summary { cursor: pointer; font-weight: bold; padding: 4px 0; color: #24292e; }
                      summary:hover { color: #0366d6; }
                      .sub-folder { margin-top: 8px; padding-left: 10px; border-left: 2px solid #e1e4e8; }
                  </style>
              </head>
              <body>
                  <h1>${headingText}</h1>
                  ${treeHtml}
              </body>
              </html>`;

              fs.writeFileSync(path.join(targetDir, "index.html"), htmlContent);
              console.log(`${dirName}/index.html 생성 완료`);
            }

            buildTreeIndex("eb", "Eb Directory HTML List", "📁 Eb Directory Structure");
            buildTreeIndex("co", "Co Directory HTML List", "📁 Co Directory Structure");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (GitHub Pages 전용)
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
