              }
              .ui-popup-box {
                width: 100%;
                max-width: 420px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 12px;
                box-shadow: 0 12px 32px rgba(31, 35, 40, 0.16);
                overflow: hidden;
              }
              .ui-popup-title {
                padding: 14px 18px 10px;
                border-bottom: 1px solid #eef1f4;
                font-size: 1rem;
                font-weight: 700;
                color: var(--text);
              }
              .ui-popup-message {
                padding: 14px 18px;
                font-size: 0.9rem;
                color: var(--text);
                white-space: pre-line;
                word-break: break-word;
              }
              .ui-popup-input-row[hidden] {
                display: none;
              }
              .ui-popup-input-row {
                padding: 0 18px 14px;
              }
              .ui-popup-input {
                width: 100%;
                padding: 9px 11px;
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 0.9rem;
                font-family: inherit;
                color: var(--text);
                background: var(--bg);
                outline: none;
              }
              .ui-popup-input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-bg);
              }
              .ui-popup-actions {
                padding: 10px 18px 14px;
                display: flex;
                justify-content: flex-end;
                gap: 8px;
              }
              .ui-btn {
                padding: 7px 14px;
                border-radius: 8px;
                font-size: 0.85rem;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
                border: 1px solid transparent;
              }
              .ui-btn[hidden] {
                display: none;
              }
              .ui-btn-secondary {
                background: var(--bg);
                border-color: var(--border);
                color: var(--text);
              }
              .ui-btn-secondary:hover {
                background: var(--surface);
              }
              .ui-btn-primary {
                background: var(--accent);
                color: #ffffff;
              }
              .ui-btn-primary:hover {
                filter: brightness(0.95);
              }
              @media (max-width: 600px) {
                :root { --header-h: 54px; }
                body { padding: calc(var(--header-h) + 14px) 12px 36px; font-size: 15px; }
                .tabs { padding: 0 12px; }
                h1 { font-size: 1.2rem; }
                .file-list li {
                  flex-direction: column;
                  align-items: flex-start;
                  gap: 6px;
                  padding: 8px 2px;
                }
                .file-link-row {
                  flex-direction: column;
                  align-items: flex-start;
                  gap: 2px;
                }
                .page-title {
                  font-size: 0.78rem;
                }
                .meta {
                  width: 100%;
                  flex-wrap: wrap;
                  justify-content: flex-end;
                }
                .date {
                  margin-right: auto;
                  font-size: 0.78rem;
                }
              }
            </style>
          </head>
          <body>
            ${renderNav(activeKey)}
            <div class="container">
              <h1>${escapeAttr(heading)}</h1>
              ${bodyHtml}
            </div>
            ${popupMarkup}
            ${clientScript}
          </body>
          </html>`;
          }

          const colDir = path.join(rootDir, "col");
          if (fs.existsSync(colDir)) {
            const colFiles = fs
              .readdirSync(colDir)
              .filter((file) => file.endsWith(".html") && file !== "index.html")
              .map((file) => {
                const fullPath = path.join(colDir, file);
                const mtime = getGitOrStatMtime(`col/${file}`, fullPath);
                const meta = getHtmlMetaInfo(fullPath);
                return {
                  name: file,
                  pageTitle: meta.pageTitle,
                  keywords: meta.keywords,
                  mtime,
                  dayStr: formatKstDateOnly(mtime),
                  timeStr: formatKst(mtime)
                };
              })
              .sort((a, b) => b.mtime - a.mtime);

            const groupedByDate = new Map();
            for (const f of colFiles) {
              if (!groupedByDate.has(f.dayStr)) {
                groupedByDate.set(f.dayStr, []);
              }
              groupedByDate.get(f.dayStr).push(f);
            }

            const colGroupedHtml = Array.from(groupedByDate.entries())
              .map(([dayStr, files]) => {
                const isToday = dayStr === todayKstStr;
                const openAttr = isToday ? " open" : "";
                const todayBadge = isToday ? `<span class="today-tag">오늘</span>` : "";
                const rowsHtml = files
                  .map((f) =>
                    renderFileRow({
                      href: f.name,
                      fileName: f.name,
                      pageTitle: f.pageTitle,
                      keywords: f.keywords,
                      repoPath: `col/${f.name}`,
                      timeStr: f.timeStr,
                      openInNewTab: false,
                      allowTitleEdit: true,
                      allowTagEdit: true
                    })
                  )
                  .join("\n");

                return `<details${openAttr}>
                  <summary>
                    <span class="summary-left">${escapeAttr(dayStr)}${todayBadge}</span>
                    <span class="summary-actions">
                      <span class="count-badge">${files.length}개</span>
                    </span>
                  </summary>
                  <div class="folder-body">
                    <ul class="file-list">
                      ${rowsHtml}
                    </ul>
                  </div>
                </details>`;
              })
              .join("\n");

            fs.writeFileSync(
              path.join(colDir, "index.html"),
              wrapPage({
                title: "col — HTML 목록",
                heading: `col (${colFiles.length}개)`,
                activeKey: "col",
                bodyHtml: colGroupedHtml
              })
            );
            console.log("col/index.html 생성 완료");
          } else {
            console.log("col 디렉토리가 존재하지 않습니다.");
          }

          function buildTreeIndex(
            dirName,
            {
              allowRename = false,
              allowDirDelete = false,
              showPageTitle = false,
              allowTitleEdit = false,
              allowTagEdit = true
            } = {}
          ) {
            const targetDir = path.join(rootDir, dirName);
            if (!fs.existsSync(targetDir)) {
              console.log(`${dirName} 디렉토리가 존재하지 않습니다.`);
              return;
            }

            function scanDirectory(dir, relativePath = "") {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              let latestTime = 0;
              let totalFiles = 0;
              const structure = { directories: {}, files: [], latestMtime: 0, totalFiles: 0 };

              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                const relPath = path.join(relativePath, entry.name);

                if (entry.isDirectory()) {
                  const subNode = scanDirectory(fullPath, relPath);
                  structure.directories[entry.name] = subNode;
                  totalFiles += subNode.totalFiles;
                  if (subNode.latestMtime > latestTime) {
                    latestTime = subNode.latestMtime;
                  }
                } else if (
                  entry.isFile() &&
                  entry.name.endsWith(".html") &&
                  entry.name !== "index.html"
                ) {
                  const mtime = getGitOrStatMtime(`${dirName}/${relPath}`, fullPath);
                  const fileTime = mtime.getTime();
                  if (fileTime > latestTime) {
                    latestTime = fileTime;
                  }
                  totalFiles += 1;

                  const posixRel = relPath.replace(/\\/g, "/");
                  const meta = getHtmlMetaInfo(fullPath);
                  structure.files.push({
                    name: entry.name,
                    pageTitle: showPageTitle ? meta.pageTitle : "",
                    keywords: allowTagEdit ? meta.keywords : "",
                    path: posixRel,
                    repoPath: `${dirName}/${posixRel}`,
                    timeStr: formatKst(mtime)
                  });
                }
              }

              structure.files.sort((a, b) =>
                a.name.localeCompare(b.name, "ko", { numeric: true })
              );
              structure.latestMtime = latestTime;
              structure.totalFiles = totalFiles;
              return structure;
            }

            function renderTree(node, currentPrefix = "") {
              let html = "";

              if (node.files && node.files.length > 0) {
                html += `<ul class="file-list">\n${node.files
                  .map((file) =>
                    renderFileRow({
                      href: file.path,
                      fileName: file.name,
                      pageTitle: file.pageTitle,
                      keywords: file.keywords,
                      repoPath: file.repoPath,
                      timeStr: file.timeStr,
                      openInNewTab: true,
                      allowTitleEdit,
                      allowTagEdit
                    })
                  )
                  .join("\n")}\n</ul>`;
              }

              const sortedDirs = Object.entries(node.directories).sort((a, b) => {
                if (b[1].latestMtime !== a[1].latestMtime) {
                  return b[1].latestMtime - a[1].latestMtime;
                }
                return a[0].localeCompare(b[0], "ko", { numeric: true });
              });

              for (const [subDirName, subNode] of sortedDirs) {
                const hasContent =
                  subNode.files.length > 0 || Object.keys(subNode.directories).length > 0;
                if (hasContent) {
                  const subRepoPath = currentPrefix ? `${currentPrefix}/${subDirName}` : subDirName;
                  const countBadgeHtml = `<span class="count-badge">${subNode.totalFiles}개</span>`;
                  const renameBtnHtml = allowRename
                    ? `<button type="button" class="rename-btn" data-dir-path="${escapeAttr(subRepoPath)}" data-dir-name="${escapeAttr(subDirName)}" onclick="renameDirectory(event, this)" title="디렉토리 이름 변경">변경</button>`
                    : "";
                  const delDirBtnHtml = allowDirDelete
                    ? `<button type="button" class="del-btn" data-dir-path="${escapeAttr(subRepoPath)}" data-dir-name="${escapeAttr(subDirName)}" onclick="deleteDirectory(event, this)" title="디렉토리 삭제">삭제</button>`
                    : "";
                  const actionsHtml = `<span class="summary-actions">${countBadgeHtml}${renameBtnHtml}${delDirBtnHtml}</span>`;
                  html += `<details>
            <summary>
              <span class="summary-left">${escapeAttr(subDirName)}</span>
              ${actionsHtml}
            </summary>
            <div class="folder-body">
              ${renderTree(subNode, subRepoPath)}
            </div>
          </details>`;
                }
              }

              return html;
            }

            const rootNode = scanDirectory(targetDir);
            const treeHtml = renderTree(rootNode, dirName);
            fs.writeFileSync(
              path.join(targetDir, "index.html"),
              wrapPage({
                title: `${dirName} — HTML 목록`,
                heading: `${dirName} (${rootNode.totalFiles}개)`,
                activeKey: dirName,
                bodyHtml: treeHtml
              })
            );
            console.log(`${dirName}/index.html 생성 완료`);
          }

          buildTreeIndex("eb", {
            allowRename: true,
            allowDirDelete: true,
            showPageTitle: true,
            allowTitleEdit: true,
            allowTagEdit: true
          });
          buildTreeIndex("co", {
            allowRename: true,
            allowDirDelete: false,
            showPageTitle: true,
            allowTitleEdit: true,
            allowTagEdit: true
          });
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (GitHub Pages 전용)
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
