name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main  # 메인 브랜치에 푸시될 때 실행

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 실행 제어 (이전에 실행 중인 배포가 있다면 취소하여 충돌 방지)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Index.html 자동 생성 스크립트 실행
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const colDir = path.join(__dirname, "col");
            
            if (!fs.existsSync(colDir)) {
              console.log("col 디렉토리가 존재하지 않습니다.");
              process.exit(0);
            }

            const files = fs.readdirSync(colDir)
              .filter(file => file.endsWith(".html") && file !== "index.html");

            const listItems = files.map(file => {
              const title = file.replace(/\.html$/, "");
              return `<li><a href="${file}">${title}</a></li>`;
            }).join("\n");

            const htmlContent = `<!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <title>Col HTML 파일 목록</title>
                <style>
                    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
                    h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
                    ul { line-height: 1.6; }
                </style>
            </head>
            <body>
                <h1>📁 Col Directory HTML List</h1>
                <ul>
                    ${listItems}
                </ul>
            </body>
            </html>`;

            fs.writeFileSync(path.join(colDir, "index.html"), htmlContent);
            console.log("col/index.html이 성공적으로 생성되었습니다.");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (GitHub Pages 전용)
        uses: actions/upload-pages-artifact@v3
        with:
          # 전체 프로젝트 폴더를 Pages 배포 대상으로 지정 (col 폴더가 포함됨)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
