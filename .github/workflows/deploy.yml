name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Col 디렉토리 Index.html 자동 생성
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            const colDir = path.resolve("col");
            if (!fs.existsSync(colDir)) {
              fs.mkdirSync(colDir, { recursive: true });
            }

            const files = fs.readdirSync(colDir)
              .filter(file => file.endsWith(".html") && file !== "index.html")
              .map(file => {
                const filePath = `col/${file}`;
                let mtime;

                try {
                  const gitTime = execSync(
                    `git log -1 --format=%ct -- "${filePath}"`,
                    { encoding: "utf-8" }
                  ).trim();

                  mtime = gitTime
                    ? new Date(Number(gitTime) * 1000)
                    : fs.statSync(path.join(colDir, file)).mtime;
                } catch {
                  mtime = fs.statSync(path.join(colDir, file)).mtime;
                }

                return {
                  name: file,
                  title: file.replace(/\.html$/, ""),
                  mtime
                };
              })
              .sort((a, b) => b.mtime - a.mtime);

            const listItems = files.map(file => {
              const date = file.mtime.toLocaleString("sv-SE", {
                timeZone: "Asia/Seoul"
              });

              return `<li><a href="${file.name}">${file.title}</a>
                <span class="date">[${date}]</span></li>`;
            }).join("\n");

            fs.writeFileSync(path.join(colDir, "index.html"), `<!DOCTYPE html>
            <html lang="ko">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>Col HTML 파일 목록</title>
                <style>
                  body { font-family: sans-serif; max-width: 600px; margin: 50px auto; }
                  li { margin-bottom: 8px; }
                  .date { float: right; color: #888; }
                </style>
              </head>
              <body>
                <h1>Col Directory HTML List</h1>
                <ul>${listItems}</ul>
              </body>
            </html>`);
          '

      - name: Eb 및 Co 디렉토리 Index.html 자동 생성
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            function buildIndex(dirName) {
              const targetDir = path.resolve(dirName);
              if (!fs.existsSync(targetDir)) {
                fs.mkdirSync(targetDir, { recursive: true });
              }

              const files = fs.readdirSync(targetDir, { withFileTypes: true })
                .filter(entry => entry.isFile()
                  && entry.name.endsWith(".html")
                  && entry.name !== "index.html")
                .map(entry => entry.name)
                .sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));

              const links = files.map(file =>
                `<li><a href="${file}" target="_blank">${file.replace(/\.html$/, "")}</a></li>`
              ).join("\n");

              fs.writeFileSync(path.join(targetDir, "index.html"), `<!DOCTYPE html>
              <html lang="ko">
                <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <title>${dirName} Directory HTML List</title>
                </head>
                <body>
                  <h1>${dirName} Directory HTML List</h1>
                  <ul>${links}</ul>
                </body>
              </html>`);
            }

            buildIndex("eb");
            buildIndex("co");
          '

      - name: 업로드 전 게시물 확인
        run: |
          test -f index.html || echo '<h1>Deployment OK</h1>' > index.html
          test -f col/index.html
          test -f eb/index.html
          test -f co/index.html
          find . -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
