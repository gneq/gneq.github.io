name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HTML Index 자동 생성 (co, col, eb)
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const rootDir = process.cwd();
          const tabs = [
            { key: "co", label: "co", href: "../co/" },
            { key: "col", label: "col", href: "../col/" },
            { key: "eb", label: "eb", href: "../eb/" }
          ];

          const formatter = new Intl.DateTimeFormat("ko-KR", {
            timeZone: "Asia/Seoul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          });

          function formatKst(date) {
            const parts = formatter.formatToParts(date);
            const dateObj = {};
            for (const p of parts) {
              dateObj[p.type] = p.value;
            }
            return `${dateObj.year}-${dateObj.month}-${dateObj.day} ${dateObj.hour}:${dateObj.minute}`;
          }

          function getGitOrStatMtime(repoRelPath, fullPath) {
            try {
              const gitPath = repoRelPath.replace(/\\/g, "/");
              const gitTimeStr = execSync(`git log -1 --format=%ct -- "${gitPath}"`, {
                encoding: "utf-8"
              }).trim();
              if (gitTimeStr) {
                return new Date(parseInt(gitTimeStr, 10) * 1000);
              }
            } catch (e) {}
            return fs.statSync(fullPath).mtime;
          }

          function escapeAttr(str) {
            return String(str)
              .replace(/&/g, "&amp;")
              .replace(/"/g, "&quot;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }

          function renderNav(activeKey) {
            const items = tabs
              .map((t) => {
                const activeClass = t.key === activeKey ? ' class="active"' : "";
                return `<a href="${t.href}"${activeClass}>${t.label}</a>`;
              })
              .join("\n");
            return `<nav class="tabs" aria-label="디렉토리 전환">
              <div class="tab-links">\n${items}\n</div>
              <button type="button" class="token-btn" onclick="manageToken()">토큰 설정</button>
            </nav>`;
          }

          function renderFileRow({ href, title, repoPath, timeStr, openInNewTab }) {
            const targetAttr = openInNewTab ? ' target="_blank" rel="noopener"' : "";
            return `<li>
              <a href="${escapeAttr(href)}"${targetAttr}>${escapeAttr(title)}</a>
              <span class="meta">
                <span class="date">${timeStr}</span>
                <button type="button" class="del-btn" data-path="${escapeAttr(repoPath)}" onclick="deleteHtmlFile(this)" title="GitHub에서 삭제">삭제</button>
              </span>
            </li>`;
          }

          const clientScript = [
            "<script>",
            'const TOKEN_KEY = "gh_pages_delete_token";',
            "function getRepoInfo() {",
            "  const hostParts = window.location.hostname.split(\".\");",
            "  const owner = hostParts[0] || \"\";",
            "  const pathParts = window.location.pathname.split(\"/\").filter(Boolean);",
            "  let repo = `${owner}.github.io`;",
            "  if (!window.location.hostname.endsWith(\".github.io\") && pathParts.length > 0) {",
            "    repo = pathParts[0];",
            "  }",
            "  return { owner, repo };",
            "}",
            "function manageToken() {",
            "  const current = localStorage.getItem(TOKEN_KEY) || \"\";",
            "  const next = prompt(",
            "    \"GitHub Fine-grained PAT를 입력하세요 (빈 값 입력 시 삭제):\",",
            "    current",
            "  );",
            "  if (next === null) return;",
            "  const trimmed = next.trim();",
            "  if (!trimmed) {",
            "    localStorage.removeItem(TOKEN_KEY);",
            "    alert(\"저장된 토큰을 삭제했습니다.\");",
            "  } else {",
            "    localStorage.setItem(TOKEN_KEY, trimmed);",
            "    alert(\"토큰이 브라우저 localStorage에 저장되었습니다.\");",
            "  }",
            "}",
            "async function ensureToken() {",
            "  let token = localStorage.getItem(TOKEN_KEY);",
            "  if (!token) {",
            "    const input = prompt(",
            "      \"파일 삭제를 위해 GitHub PAT(Contents: Read and write 권한)를 입력하세요:\"",
            "    );",
            "    if (!input || !input.trim()) return null;",
            "    token = input.trim();",
            "    localStorage.setItem(TOKEN_KEY, token);",
            "  }",
            "  return token;",
            "}",
            "async function deleteHtmlFile(btn) {",
            "  const filePath = btn.getAttribute(\"data-path\");",
            "  if (!filePath) return;",
            "  const ok = confirm(`정말로 GitHub에서 '${filePath}' 파일을 삭제할까요?\\n삭제 커밋이 main 브랜치에 반영됩니다.`);",
            "  if (!ok) return;",
            "  const token = await ensureToken();",
            "  if (!token) return;",
            "  const { owner, repo } = getRepoInfo();",
            "  const encodedPath = filePath.split(\"/\").map(encodeURIComponent).join(\"/\");",
            "  const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents/${encodedPath}`;",
            "  const headers = {",
            "    \"Authorization\": `Bearer ${token}`,",
            "    \"Accept\": \"application/vnd.github+json\",",
            "    \"X-GitHub-Api-Version\": \"2022-11-28\"",
            "  };",
            "  btn.disabled = true;",
            "  const origText = btn.textContent;",
            "  btn.textContent = \"삭제중...\";",
            "  try {",
            "    const getRes = await fetch(apiBase, { headers });",
            "    if (!getRes.ok) {",
            "      const errData = await getRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `파일 정보 조회 실패 (${getRes.status})`);",
            "    }",
            "    const fileInfo = await getRes.json();",
            "    const delRes = await fetch(apiBase, {",
            "      method: \"DELETE\",",
            "      headers: { ...headers, \"Content-Type\": \"application/json\" },",
            "      body: JSON.stringify({",
            "        message: `chore: delete ${filePath}`,",
            "        sha: fileInfo.sha,",
            "        branch: \"main\"",
            "      })",
            "    });",
            "    if (!delRes.ok) {",
            "      const errData = await delRes.json().catch(() => ({}));",
            "      throw new Error(errData.message || `삭제 실패 (${delRes.status})`);",
            "    }",
            "    const li = btn.closest(\"li\");",
            "    if (li) li.remove();",
            "    alert(`'${filePath}' 삭제가 완료되었습니다. Pages 재배포까지 잠시 기다려 주세요.`);",
            "  } catch (err) {",
            "    alert(`삭제 중 오류가 발생했습니다:\\n${err.message}`);",
            "    btn.disabled = false;",
            "    btn.textContent = origText;",
            "  }",
            "}",
            "</script>"
          ].join("\n");

          function wrapPage({ title, heading, activeKey, bodyHtml }) {
            return `<!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>${escapeAttr(title)}</title>
            <style>
              :root {
                --bg: #ffffff;
                --surface: #f8f9fa;
                --text: #1f2328;
                --muted: #656d76;
                --border: #d0d7de;
                --accent: #0969da;
                --accent-bg: #eef6ff;
                --danger: #cf222e;
                --danger-bg: #fff1f2;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                padding: 24px 16px 48px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
                font-size: 16px;
                line-height: 1.5;
                color: var(--text);
                background: var(--bg);
              }
              .container {
                max-width: 720px;
                margin: 0 auto;
              }
              .tabs {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding-bottom: 14px;
                margin-bottom: 20px;
                border-bottom: 1px solid var(--border);
              }
              .tab-links {
                display: flex;
                gap: 6px;
              }
              .tab-links a {
                padding: 6px 14px;
                border-radius: 8px;
                text-decoration: none;
                font-size: 0.92rem;
                font-weight: 600;
                color: var(--muted);
                transition: background-color 0.15s, color 0.15s;
              }
              .tab-links a:hover {
                color: var(--text);
                background: var(--surface);
              }
              .tab-links a.active {
                color: var(--accent);
                background: var(--accent-bg);
              }
              .token-btn {
                padding: 5px 10px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--bg);
                color: var(--muted);
                font-size: 0.78rem;
                cursor: pointer;
              }
              .token-btn:hover {
                color: var(--text);
                background: var(--surface);
              }
              h1 {
                margin: 0 0 18px;
                font-size: 1.35rem;
                font-weight: 700;
                letter-spacing: -0.01em;
              }
              ul {
                list-style: none;
                margin: 0;
                padding: 0;
              }
              .file-list li {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                padding: 9px 4px;
                border-bottom: 1px solid #eef1f4;
              }
              .file-list a {
                color: var(--accent);
                text-decoration: none;
                font-weight: 500;
                word-break: break-word;
              }
              .file-list a:hover {
                text-decoration: underline;
              }
              .meta {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                flex-shrink: 0;
              }
              .date {
                font-size: 0.82rem;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
              }
              .del-btn {
                padding: 2px 7px;
                border: 1px solid #f3c2c6;
                border-radius: 5px;
                background: transparent;
                color: var(--danger);
                font-size: 0.75rem;
                line-height: 1.3;
                cursor: pointer;
                opacity: 0.75;
                transition: background-color 0.15s, opacity 0.15s;
              }
              .del-btn:hover:not(:disabled) {
                opacity: 1;
                background: var(--danger-bg);
              }
              .del-btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
              }
              details {
                margin: 10px 0;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface);
                overflow: hidden;
              }
              summary {
                cursor: pointer;
                padding: 10px 14px;
                font-weight: 600;
                font-size: 0.95rem;
                list-style: none;
                display: flex;
                align-items: center;
                gap: 6px;
              }
              summary::-webkit-details-marker { display: none; }
              summary::before {
                content: "▸";
                color: var(--muted);
                font-size: 0.8rem;
                transition: transform 0.15s;
              }
              details[open] > summary::before {
                transform: rotate(90deg);
              }
              .folder-body {
                background: var(--bg);
                padding: 4px 12px 10px 18px;
                border-top: 1px solid #e5e9ee;
              }
              @media (max-width: 600px) {
                body { padding: 16px 12px 36px; font-size: 15px; }
                h1 { font-size: 1.2rem; }
                .file-list li {
                  flex-direction: column;
                  align-items: flex-start;
                  gap: 4px;
                  padding: 8px 2px;
                }
                .meta {
                  width: 100%;
                  justify-content: space-between;
                }
                .date { font-size: 0.78rem; }
              }
            </style>
          </head>
          <body>
            <div class="container">
              ${renderNav(activeKey)}
              <h1>${escapeAttr(heading)}</h1>
              ${bodyHtml}
            </div>
            ${clientScript}
          </body>
          </html>`;
          }

          const colDir = path.join(rootDir, "col");
          if (fs.existsSync(colDir)) {
            const colFiles = fs
              .readdirSync(colDir)
              .filter((file) => file.endsWith(".html") && file !== "index.html")
              .map((file) => {
                const fullPath = path.join(colDir, file);
                const mtime = getGitOrStatMtime(`col/${file}`, fullPath);
                return {
                  name: file,
                  title: file.replace(/\.html$/, ""),
                  mtime,
                  timeStr: formatKst(mtime)
                };
              })
              .sort((a, b) => b.mtime - a.mtime);

            const colListHtml = `<ul class="file-list">\n${colFiles
              .map((f) =>
                renderFileRow({
                  href: f.name,
                  title: f.title,
                  repoPath: `col/${f.name}`,
                  timeStr: f.timeStr,
                  openInNewTab: false
                })
              )
              .join("\n")}\n</ul>`;

            fs.writeFileSync(
              path.join(colDir, "index.html"),
              wrapPage({
                title: "col — HTML 목록",
                heading: "col",
                activeKey: "col",
                bodyHtml: colListHtml
              })
            );
            console.log("col/index.html 생성 완료");
          } else {
            console.log("col 디렉토리가 존재하지 않습니다.");
          }

          function buildTreeIndex(dirName) {
            const targetDir = path.join(rootDir, dirName);
            if (!fs.existsSync(targetDir)) {
              console.log(`${dirName} 디렉토리가 존재하지 않습니다.`);
              return;
            }

            function scanDirectory(dir, relativePath = "") {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              let latestTime = 0;
              const structure = { directories: {}, files: [], latestMtime: 0 };

              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                const relPath = path.join(relativePath, entry.name);

                if (entry.isDirectory()) {
                  const subNode = scanDirectory(fullPath, relPath);
                  structure.directories[entry.name] = subNode;
                  if (subNode.latestMtime > latestTime) {
                    latestTime = subNode.latestMtime;
                  }
                } else if (
                  entry.isFile() &&
                  entry.name.endsWith(".html") &&
                  entry.name !== "index.html"
                ) {
                  const mtime = getGitOrStatMtime(`${dirName}/${relPath}`, fullPath);
                  const fileTime = mtime.getTime();
                  if (fileTime > latestTime) {
                    latestTime = fileTime;
                  }

                  const posixRel = relPath.replace(/\\/g, "/");
                  structure.files.push({
                    name: entry.name,
                    title: entry.name.replace(/\.html$/, ""),
                    path: posixRel,
                    repoPath: `${dirName}/${posixRel}`,
                    timeStr: formatKst(mtime)
                  });
                }
              }

              structure.files.sort((a, b) =>
                a.name.localeCompare(b.name, "ko", { numeric: true })
              );
              structure.latestMtime = latestTime;
              return structure;
            }

            function renderTree(node) {
              let html = "";

              if (node.files && node.files.length > 0) {
                html += `<ul class="file-list">\n${node.files
                  .map((file) =>
                    renderFileRow({
                      href: file.path,
                      title: file.title,
                      repoPath: file.repoPath,
                      timeStr: file.timeStr,
                      openInNewTab: true
                    })
                  )
                  .join("\n")}\n</ul>`;
              }

              const sortedDirs = Object.entries(node.directories).sort((a, b) => {
                if (b[1].latestMtime !== a[1].latestMtime) {
                  return b[1].latestMtime - a[1].latestMtime;
                }
                return a[0].localeCompare(b[0], "ko", { numeric: true });
              });

              for (const [subDirName, subNode] of sortedDirs) {
                const hasContent =
                  subNode.files.length > 0 || Object.keys(subNode.directories).length > 0;
                if (hasContent) {
                  html += `<details>
            <summary>${escapeAttr(subDirName)}</summary>
            <div class="folder-body">
              ${renderTree(subNode)}
            </div>
          </details>`;
                }
              }

              return html;
            }

            const treeHtml = renderTree(scanDirectory(targetDir));
            fs.writeFileSync(
              path.join(targetDir, "index.html"),
              wrapPage({
                title: `${dirName} — HTML 목록`,
                heading: dirName,
                activeKey: dirName,
                bodyHtml: treeHtml
              })
            );
            console.log(`${dirName}/index.html 생성 완료`);
          }

          buildTreeIndex("eb");
          buildTreeIndex("co");
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (GitHub Pages 전용)
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
