name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main  # 메인 브랜치에 푸시될 때 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Index.html 자동 생성 및 시간순 정렬 스크립트 실행
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const colDir = path.join(__dirname, "col");
            
            if (!fs.existsSync(colDir)) {
              console.log("col 디렉토리가 존재하지 않습니다.");
              process.exit(0);
            }

            // 파일 정보(이름, 수정 시간)를 객체 형태로 수집
            const files = fs.readdirSync(colDir)
              .filter(file => file.endsWith(".html") && file !== "index.html")
              .map(file => {
                const filePath = path.join(colDir, file);
                const stats = fs.statSync(filePath);
                return {
                  name: file,
                  title: file.replace(/\.html$/, ""),
                  mtime: stats.mtime // 파일 수정 시간
                };
              });

            // 최신 수정일 순으로 정렬 (내림차순: 가장 최근에 수정된 파일이 위로)
            files.sort((a, b) => b.mtime - a.mtime);

            // HTML 리스트 항목 생성 (시간 표시 포함)
            const listItems = files.map(file => {
              // 날짜 포맷팅 (YYYY-MM-DD HH:mm:ss)
              const d = new Date(file.mtime);
              const year = d.getFullYear();
              const month = String(d.getMonth() + 1).padStart(2, "0");
              const day = String(d.getDate()).padStart(2, "0");
              const hours = String(d.getHours()).padStart(2, "0");
              const minutes = String(d.getMinutes()).padStart(2, "0");
              const timeStr = `${year}-${month}-${day} ${hours}:${minutes}`;

              return `<li>
                <a href="${file.name}">${file.title}</a>
                <span class="date">[${timeStr}]</span>
              </li>`;
            }).join("\n");

            const htmlContent = `<!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <title>Col HTML 파일 목록</title>
                <style>
                    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
                    h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
                    ul { line-height: 1.8; list-style-type: none; padding: 0; }
                    li { margin-bottom: 8px; border-bottom: 1px dashed #f0f0f0; padding-bottom: 4px; }
                    a { text-decoration: none; color: #0066cc; font-weight: bold; }
                    a:hover { text-decoration: underline; }
                    .date { float: right; color: #888; font-size: 0.85em; }
                </style>
            </head>
            <body>
                <h1>📁 Col Directory HTML List</h1>
                <ul>
                    ${listItems}
                </ul>
            </body>
            </html>`;

            fs.writeFileSync(path.join(colDir, "index.html"), htmlContent);
            console.log("col/index.html이 시간순 정렬 및 날짜 표시와 함께 생성되었습니다.");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (GitHub Pages 전용)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
