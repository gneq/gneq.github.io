name: Generate HTML Index and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HTML Index 자동 생성 (co, col, eb)
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const rootDir = process.cwd();
          const tabs = [
            { key: "co", label: "co", href: "../co/" },
            { key: "col", label: "col", href: "../col/" },
            { key: "eb", label: "eb", href: "../eb/" }
          ];

          const formatter = new Intl.DateTimeFormat("ko-KR", {
            timeZone: "Asia/Seoul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          });

          function formatKst(date) {
            const parts = formatter.formatToParts(date);
            const dateObj = {};
            for (const p of parts) {
              dateObj[p.type] = p.value;
            }
            return `${dateObj.year}-${dateObj.month}-${dateObj.day} ${dateObj.hour}:${dateObj.minute}`;
          }

          function getGitOrStatMtime(repoRelPath, fullPath) {
            try {
              const gitPath = repoRelPath.replace(/\\/g, "/");
              const gitTimeStr = execSync(`git log -1 --format=%ct -- "${gitPath}"`, {
                encoding: "utf-8"
              }).trim();
              if (gitTimeStr) {
                return new Date(parseInt(gitTimeStr, 10) * 1000);
              }
            } catch (e) {}
            return fs.statSync(fullPath).mtime;
          }

          function renderNav(activeKey) {
            const items = tabs
              .map((t) => {
                const activeClass = t.key === activeKey ? ' class="active"' : "";
                return `<a href="${t.href}"${activeClass}>${t.label}</a>`;
              })
              .join("\n");
            return `<nav class="tabs" aria-label="디렉토리 전환">\n${items}\n</nav>`;
          }

          function wrapPage({ title, heading, activeKey, bodyHtml }) {
            return `<!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>${title}</title>
            <style>
              :root {
                --bg: #ffffff;
                --surface: #f8f9fa;
                --text: #1f2328;
                --muted: #656d76;
                --border: #d0d7de;
                --accent: #0969da;
                --accent-bg: #eef6ff;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                padding: 24px 16px 48px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
                font-size: 16px;
                line-height: 1.5;
                color: var(--text);
                background: var(--bg);
              }
              .container {
                max-width: 720px;
                margin: 0 auto;
              }
              .tabs {
                display: flex;
                gap: 6px;
                padding-bottom: 14px;
                margin-bottom: 20px;
                border-bottom: 1px solid var(--border);
              }
              .tabs a {
                padding: 6px 14px;
                border-radius: 8px;
                text-decoration: none;
                font-size: 0.92rem;
                font-weight: 600;
                color: var(--muted);
                transition: background-color 0.15s, color 0.15s;
              }
              .tabs a:hover {
                color: var(--text);
                background: var(--surface);
              }
              .tabs a.active {
                color: var(--accent);
                background: var(--accent-bg);
              }
              h1 {
                margin: 0 0 18px;
                font-size: 1.35rem;
                font-weight: 700;
                letter-spacing: -0.01em;
              }
              ul {
                list-style: none;
                margin: 0;
                padding: 0;
              }
              .file-list li {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                padding: 9px 4px;
                border-bottom: 1px solid #eef1f4;
              }
              .file-list a {
                color: var(--accent);
                text-decoration: none;
                font-weight: 500;
                word-break: break-word;
              }
              .file-list a:hover {
                text-decoration: underline;
              }
              .date {
                flex-shrink: 0;
                font-size: 0.82rem;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
              }
              details {
                margin: 10px 0;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface);
                overflow: hidden;
              }
              summary {
                cursor: pointer;
                padding: 10px 14px;
                font-weight: 600;
                font-size: 0.95rem;
                list-style: none;
                display: flex;
                align-items: center;
                gap: 6px;
              }
              summary::-webkit-details-marker { display: none; }
              summary::before {
                content: "▸";
                color: var(--muted);
                font-size: 0.8rem;
                transition: transform 0.15s;
              }
              details[open] > summary::before {
                transform: rotate(90deg);
              }
              .folder-body {
                background: var(--bg);
                padding: 4px 12px 10px 18px;
                border-top: 1px solid #e5e9ee;
              }
              @media (max-width: 600px) {
                body { padding: 16px 12px 36px; font-size: 15px; }
                h1 { font-size: 1.2rem; }
                .file-list li {
                  flex-direction: column;
                  align-items: flex-start;
                  gap: 2px;
                  padding: 8px 2px;
                }
                .date { font-size: 0.78rem; }
              }
            </style>
          </head>
          <body>
            <div class="container">
              ${renderNav(activeKey)}
              <h1>${heading}</h1>
              ${bodyHtml}
            </div>
          </body>
          </html>`;
          }

          const colDir = path.join(rootDir, "col");
          if (fs.existsSync(colDir)) {
            const colFiles = fs
              .readdirSync(colDir)
              .filter((file) => file.endsWith(".html") && file !== "index.html")
              .map((file) => {
                const fullPath = path.join(colDir, file);
                const mtime = getGitOrStatMtime(`col/${file}`, fullPath);
                return {
                  name: file,
                  title: file.replace(/\.html$/, ""),
                  mtime,
                  timeStr: formatKst(mtime)
                };
              })
              .sort((a, b) => b.mtime - a.mtime);

            const colListHtml = `<ul class="file-list">\n${colFiles
              .map(
                (f) =>
                  `  <li><a href="${f.name}">${f.title}</a><span class="date">${f.timeStr}</span></li>`
              )
              .join("\n")}\n</ul>`;

            fs.writeFileSync(
              path.join(colDir, "index.html"),
              wrapPage({
                title: "col — HTML 목록",
                heading: "col",
                activeKey: "col",
                bodyHtml: colListHtml
              })
            );
            console.log("col/index.html 생성 완료");
          } else {
            console.log("col 디렉토리가 존재하지 않습니다.");
          }

          function buildTreeIndex(dirName) {
            const targetDir = path.join(rootDir, dirName);
            if (!fs.existsSync(targetDir)) {
              console.log(`${dirName} 디렉토리가 존재하지 않습니다.`);
              return;
            }

            function scanDirectory(dir, relativePath = "") {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              let latestTime = 0;
              const structure = { directories: {}, files: [], latestMtime: 0 };

              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                const relPath = path.join(relativePath, entry.name);

                if (entry.isDirectory()) {
                  const subNode = scanDirectory(fullPath, relPath);
                  structure.directories[entry.name] = subNode;
                  if (subNode.latestMtime > latestTime) {
                    latestTime = subNode.latestMtime;
                  }
                } else if (
                  entry.isFile() &&
                  entry.name.endsWith(".html") &&
                  entry.name !== "index.html"
                ) {
                  const mtime = getGitOrStatMtime(`${dirName}/${relPath}`, fullPath);
                  const fileTime = mtime.getTime();
                  if (fileTime > latestTime) {
                    latestTime = fileTime;
                  }

                  structure.files.push({
                    name: entry.name,
                    title: entry.name.replace(/\.html$/, ""),
                    path: relPath.replace(/\\/g, "/"),
                    timeStr: formatKst(mtime)
                  });
                }
              }

              structure.files.sort((a, b) =>
                a.name.localeCompare(b.name, "ko", { numeric: true })
              );
              structure.latestMtime = latestTime;
              return structure;
            }

            function renderTree(node) {
              let html = "";

              if (node.files && node.files.length > 0) {
                html += `<ul class="file-list">\n${node.files
                  .map(
                    (file) =>
                      `  <li><a href="${file.path}" target="_blank" rel="noopener">${file.title}</a><span class="date">${file.timeStr}</span></li>`
                  )
                  .join("\n")}\n</ul>`;
              }

              const sortedDirs = Object.entries(node.directories).sort((a, b) => {
                if (b[1].latestMtime !== a[1].latestMtime) {
                  return b[1].latestMtime - a[1].latestMtime;
                }
                return a[0].localeCompare(b[0], "ko", { numeric: true });
              });

              for (const [subDirName, subNode] of sortedDirs) {
                const hasContent =
                  subNode.files.length > 0 || Object.keys(subNode.directories).length > 0;
                if (hasContent) {
                  html += `<details>
            <summary>${subDirName}</summary>
            <div class="folder-body">
              ${renderTree(subNode)}
            </div>
          </details>`;
                }
              }

              return html;
            }

            const treeHtml = renderTree(scanDirectory(targetDir));
            fs.writeFileSync(
              path.join(targetDir, "index.html"),
              wrapPage({
                title: `${dirName} — HTML 목록`,
                heading: dirName,
                activeKey: dirName,
                bodyHtml: treeHtml
              })
            );
            console.log(`${dirName}/index.html 생성 완료`);
          }

          buildTreeIndex("eb");
          buildTreeIndex("co");
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (GitHub Pages 전용)
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
